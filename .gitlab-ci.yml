workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

stages:
  - verify
  - publish

.sbt_setup:
  image: sbtscala/scala-sbt:eclipse-temurin-17_2.x
  variables:
    GIT_DEPTH: "0"
    # Image sets HOME=/home/sbtuser, but the job runs as root; sbt reads user.home (/root).
    HOME: "/root"
  before_script:
    - git fetch --tags --force
    - mkdir -p "$HOME/.config/sbt/2"
    - echo "credentials += Credentials(\"Sonatype Nexus Repository Manager\", \"nexus.waylay.io\", \"${NEXUS_USER}\", \"${NEXUS_PASSWORD}\")" > "$HOME/.config/sbt/2/global.sbt"

verify:
  stage: verify
  extends: .sbt_setup
  services:
    - name: docker:29-dind
      alias: docker
  tags:
    - gsp-privileged
  variables:
    GIT_DEPTH: "0"
    DOCKER_HOST: "tcp://docker:2376/"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  script:
    - sbt ";clean;testFull;integration/testFull"

publish:
  stage: publish
  extends: .sbt_setup
  needs:
    - verify
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - sbt +publish
